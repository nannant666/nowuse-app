name: windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'shell/**'
      - '.github/workflows/windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Assemble frontend
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          mkdir -p desktop/dist
          cp shell/index.html desktop/dist/index.html
          cp shell/logo.png desktop/dist/logo.png
          sed -i "s/__APP_VERSION__/${VERSION}/g" desktop/dist/index.html

      - name: Build installer
        working-directory: desktop
        run: npx --yes @tauri-apps/cli@2 build

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          cp desktop/src-tauri/target/release/bundle/nsis/*.exe out/
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: NowuseAI-Windows
          path: out/*.exe
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Nowuse AI Windows v${{ env.VERSION }}
          draft: false
          prerelease: false
          files: out/*.exe
